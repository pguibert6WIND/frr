!
int lo
 ip address 10.0.0.1/32
 ip address 172.16.1.1/32
 ip address 172.16.1.3/32
 ip ospf passive
!
int r1-eth0
 ip address 192.168.12.1/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
router ospf
 router-id 10.0.0.1
 network 10.0.0.1/32 area 0
 network 192.168.12.0/24 area 0
!
router bgp 65001
 neighbor 10.0.0.2 remote-as internal
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 timers 1 3
 neighbor 10.0.0.2 timers connect 1
 address-family ipv4 unicast
  network 172.16.1.1/32
  network 172.16.1.3/32 route-map aigp
 exit-address-family
!
route-map aigp permit 10
 set aigp-metric 5
!
