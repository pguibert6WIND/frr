!
int lo
 ip address 10.0.0.2/32
 ip address 172.16.2.2/32
 ip ospf passive
!
int r2-eth0
 ip address 192.168.12.2/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
int r2-eth1
 ip address 192.168.23.2/24
!
router ospf
 router-id 10.0.0.2
 network 10.0.0.2/32 area 0
 network 192.168.12.0/24 area 0
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as internal
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.0.1 timers 1 3
 neighbor 10.0.0.1 timers connect 1
 neighbor 192.168.23.3 remote-as external
 neighbor 192.168.23.3 timers 1 3
 neighbor 192.168.23.3 timers connect 1
 neighbor 192.168.23.3 aigp
 address-family ipv4 unicast
  network 172.16.2.2/32
  redistribute ospf
  neighbor 192.168.23.3 route-map aigp out
 exit-address-family
!
ip prefix-list igp-metric seq 5 permit 172.16.1.1/32
ip prefix-list igp-metric seq 10 permit 10.0.0.1/32
ip prefix-list igp-metric seq 15 permit 172.16.2.2/32
!
route-map aigp permit 10
 match ip address prefix-list igp-metric
 set aigp-metric igp-metric
!
route-map aigp permit 20
!
