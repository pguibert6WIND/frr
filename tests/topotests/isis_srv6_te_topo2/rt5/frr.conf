hostname rt5
!
! debug zebra kernel
! debug zebra packet
! debug isis events
! debug isis route-events
! debug isis spf-events
! debug isis sr-events
! debug isis lsp-gen
!
interface lo
 ipv6 address fc00:0:5::1/128
 ip router isis 1
 ipv6 router isis 1
 isis passive
!
interface eth-rt3-1
 ip address 10.0.4.5/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-rt3-2
 ip address 10.0.5.5/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-rt4
 ip address 10.0.6.5/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-rt6
 ip address 10.0.8.5/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
segment-routing
 srv6
  locators
   locator loc1
    prefix fc00:0:5::/48 block-len 32 node-len 16 func-bits 16
  !
 !
!
router isis 1
 lsp-gen-interval 2
 net 49.0000.0000.0000.0005.00
 is-type level-1
 topology ipv6-unicast
 segment-routing srv6
  locator loc1
  node-msd
   max-segs-left 3
   max-end-pop 3
   max-h-encaps 2
   max-end-d 5
  interface sr0
!
ip forwarding
!
line vty
!
