log file zebra.log
!
hostname rt4
!
! debug zebra kernel
! debug zebra packet
! debug isis events
! debug isis route-events
! debug isis spf-events
! debug isis sr-events
! debug isis lsp-gen
!
interface lo
 ipv6 address fc00:0:4::1/128
 ip router isis 1
 ipv6 router isis 1
 isis passive
!
interface eth-rt2-1
 ipv6 address 2001:db8:2::4/64
 ip address 10.0.2.4/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-rt2-2
 ipv6 address 2001:db8:3::4/64
 ip address 10.0.3.4/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-rt5
 ipv6 address 2001:db8:6::4/64
 ip address 10.0.6.4/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-rt6
 ipv6 address 2001:db8:7::4/64
 ip address 10.0.7.4/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
segment-routing
 srv6
  locators
   locator loc1
    prefix fc00:0:4::/48 block-len 32 node-len 16 func-bits 16
  !
 !
!
ip forwarding
!
router isis 1
 lsp-gen-interval 2
 net 49.0000.0000.0000.0004.00
 is-type level-1
 topology ipv6-unicast
 lsp-gen-interval 1
 lsp-refresh-interval 2
 spf-interval 1
 mpls-te on
 mpls-te export
 mpls-te router-address ipv6 fc00:0:4::1
 segment-routing srv6
  locator loc1
  node-msd
   max-segs-left 3
   max-end-pop 3
   max-h-encaps 2
   max-end-d 5
  interface sr0
!
line vty
!
