log file zebra.log
!
hostname rt6
!
! debug zebra kernel
! debug zebra packet
! debug isis events
! debug isis route-events
! debug isis spf-events
! debug isis sr-events
! debug isis lsp-gen
!
interface lo
 ipv6 address fc00:0:6::1/48
 ipv6 address fc00:0:6b::1/48
 ip router isis 1
 ipv6 router isis 1
 isis passive
!
interface eth-rt4
 ipv6 address 2001:db8:7::6/64
 ip address 10.0.7.6/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-rt5
 ipv6 address 2001:db8:8::6/64
 ip address 10.0.8.6/24
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-dst
 ip address 10.0.10.1/24
 ip address 2001:db8:10::1/64
 ip address 2001:db8:11::1/64
!
segment-routing
 srv6
  locators
   locator loc1
    prefix fc00:0:6::/48 block-len 32 node-len 16 func-bits 16
   exit
   !
   locator loc2
    prefix fc00:0:6b::/48 block-len 32 node-len 16 func-bits 16
   exit
   !
  exit
  !
 exit
 !
exit
ip forwarding
!
router isis 1
 lsp-gen-interval 2
 net 49.0000.0000.0000.0006.00
 is-type level-1
 topology ipv6-unicast
 lsp-gen-interval 1
 lsp-refresh-interval 2
 spf-interval 1
 mpls-te on
 mpls-te export
 mpls-te router-address ipv6 fc00:0:6::1
 segment-routing srv6
  locator loc1
  node-msd
   max-segs-left 3
   max-end-pop 3
   max-h-encaps 2
   max-end-d 5
  interface sr0
!
ip route fc00:0:9::1/128 2001:db8:10::2
!
router bgp 65002
 bgp router-id 192.0.2.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor fc00:0:1b::1 remote-as 65001
 neighbor fc00:0:1b::1 ebgp-multihop
 neighbor fc00:0:1b::1 update-source fc00:0:6b::1
 neighbor fc00:0:6b::1 timers 1 3
 neighbor fc00:0:1b::1 timers connect 1
 neighbor fc00:0:1b::1 capability extended-nexthop
 !
 segment-routing srv6
  locator loc2
 !
 address-family ipv6
  neighbor fc00:0:1b::1 activate
  network 2001:db8:11::1/64
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor fc00:0:1b::1 activate
 exit-address-family
 !
!
router bgp 65002 vrf vrf10
 bgp router-id 192.0.2.2
 !
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  rd vpn export 65002:10
  rt vpn both 0:10
  import vpn
  export vpn
 exit-address-family
 !
!
line vty
!
