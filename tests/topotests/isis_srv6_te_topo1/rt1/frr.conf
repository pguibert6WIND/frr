log file zebra.log
!
hostname rt1
password zebra
!
! debug zebra kernel
! debug zebra packet
! debug isis events
! debug isis route-events
! debug isis spf-events
! debug isis sr-events
! debug isis lsp-gen
!
!
interface lo
 ipv6 address fc00:0:1::1/48
 ipv6 address fc00:0:1b::1/48
 ip router isis 1
 ipv6 router isis 1
 isis passive
!
interface eth-sw1
 ip address 10.0.1.1/24
 ipv6 address 2001:db8:1::1/64
 ip router isis 1
 ipv6 router isis 1
 isis hello-interval 1
 isis hello-multiplier 10
!
interface eth-src
 ip address 10.8.0.1/24
exit
!
ip forwarding
!
router isis 1
 lsp-gen-interval 2
 net 49.0000.0000.0000.0001.00
 is-type level-1
 topology ipv6-unicast
 lsp-gen-interval 1
 lsp-refresh-interval 2
 spf-interval 1
 mpls-te on
 mpls-te export
 mpls-te router-address ipv6 fc00:0:1::1
 segment-routing srv6
  locator loc1
  node-msd
   max-segs-left 3
   max-end-pop 3
   max-h-encaps 2
   max-end-d 5
  interface sr0
!
router bgp 65001
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor fc00:0:6b::1 remote-as 65002
 neighbor fc00:0:6b::1 ebgp-multihop
 neighbor fc00:0:6b::1 update-source fc00:0:1b::1
 neighbor fc00:0:6b::1 timers 1 3
 neighbor fc00:0:6b::1 timers connect 1
 neighbor fc00:0:6b::1 capability extended-nexthop
 !
 segment-routing srv6
  locator loc2
 !
 address-family ipv6
  neighbor fc00:0:6b::1 activate
 exit-address-family
!
address-family ipv4 vpn
  neighbor fc00:0:6b::1 activate
 exit-address-family
 !
!
router bgp 65001 vrf vrf10
 bgp router-id 192.0.2.1
 !
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  rd vpn export 65001:10
  rt vpn both 0:10
  import vpn
  export vpn
 exit-address-family
 !
!
line vty
!
