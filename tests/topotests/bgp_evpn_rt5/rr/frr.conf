! debug zebra vxlan
! debug zebra kernel
! debug zebra dplane
! debug zebra rib
! debug bgp neighbor-events
! debug bgp updates
! debug bgp zebra
interface rr-eth0 vrf rr-vrf-101
 ip address 192.168.100.100/24
!

router bgp 65000 vrf rr-vrf-101
 bgp router-id 192.168.100.100
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.168.100.21 remote-as 65000
 neighbor 192.168.100.21 capability extended-nexthop
 neighbor 192.168.100.41 remote-as 65000
 neighbor 192.168.100.41 capability extended-nexthop
 !
 address-family l2vpn evpn
  neighbor 192.168.100.21 activate
  neighbor 192.168.100.41 activate
  neighbor 192.168.100.21 route-reflector-client
  neighbor 192.168.100.41 route-reflector-client
 exit-address-family
!
