router bgp 65001
 no bgp ebgp-requires-policy
 no bgp network import-check
 bgp route-reflector allow-outbound-policy
 neighbor 192.168.26.2 remote-as internal
 neighbor 192.168.26.2 timers 1 3
 neighbor 192.168.26.2 timers connect 1
 neighbor 192.168.26.2 route-reflector-client
 neighbor 192.168.36.3 remote-as internal
 neighbor 192.168.36.3 timers 1 3
 neighbor 192.168.36.3 timers connect 1
 neighbor 192.168.36.3 route-reflector-client
 neighbor 192.168.67.7 remote-as internal
 neighbor 192.168.67.7 timers 1 3
 neighbor 192.168.67.7 timers connect 1
 address-family ipv4
  neighbor 192.168.26.2 route-map set-nexthop out
  neighbor 192.168.36.3 route-map set-nexthop out
 exit-address-family
!
route-map set-nexthop permit 10
 set ip next-hop peer-address
exit
!
